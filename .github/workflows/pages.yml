name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp script and style URLs with this deploy's id (a browser never mixes files of two deploys)
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" site/js/*.js
          sed -i -E "s#(src=\"js/[A-Za-z0-9_-]+\.js)\"#\1?v=$V\"#g; s#(href=\"css/app\.css)\"#\1?v=$V\"#g" site/*.html
          grep -c "?v=$V" site/index.html site/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
